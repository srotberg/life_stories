<title>רינה רוטברג – סיפורי חיים וביוגרפיות</title>
<meta name="description" content="רינה רוטברג – כתיבת סיפורי חיים, ביוגרפיות וספרי זיכרונות. מעל 30 שנות ניסיון בהנצחת סיפורים לדורות הבאים.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --brown-dark:  #6B3F26;
    --brown-mid:   #8A5A38;
    --brown-light: #A9713F;
    --gold:        #C99B5F;
    --cream:       #FAF4E8;
    --card:        #FDF8EE;
    --ink:         #33291F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Assistant', 'Frank Ruhl Libre', 'David', Arial, sans-serif;
    background: var(--cream);
    color: var(--ink);
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  .card {
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    background: var(--card);
    box-shadow: 0 4px 30px rgba(107, 63, 38, 0.10);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ====== באנר עליון ======
     להחלפה בתמונת אמת: מוחקים את ה-svg שבתוך div.banner ומוסיפים כאן
     background: url('banner.jpg') center/cover;  */
  .banner { height: 190px; overflow: hidden; background: #3D2A1C; position: relative; }
  .banner svg { display: block; width: 100%; height: 100%; }
  /* התמונה שלכם – פשוט שמים קובץ בשם banner.jpg באותה תיקייה.
     אם אין קובץ כזה, מוצג הציור שמתחת.  */
  .banner .photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
  }
  .banner .veil {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,0) 40%, rgba(0,0,0,.30));
  }

  /* ====== תמונת פורטרט ======
     שמים קובץ בשם rina.jpg באותה תיקייה והיא תופיע כאן  */
  .portrait-wrap { display: flex; justify-content: center; margin-top: -85px; position: relative; z-index: 2; }
  .portrait {
    width: 170px; height: 170px;
    border-radius: 50%;
    border: 6px solid var(--card);
    background: #E8D9BD;
    box-shadow: 0 4px 16px rgba(107, 63, 38, 0.18);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .portrait img { grid-area: 1/1; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait .fallback {
    font-size: 15px; color: #8A6B45; text-align: center;
    line-height: 1.5; padding: 0 18px;
  }

  /* ====== שם וכותרת ====== */
  .name {
    font-family: 'Gveret Levin AlefAlefAlef', 'Frank Ruhl Libre', cursive;
    font-size: 52px; color: var(--brown-mid);
    text-align: center; margin-top: 18px; line-height: 1.15;
  }
  .subtitle {
    text-align: center; font-size: 21px; color: var(--ink);
    margin-top: 6px; font-weight: 600;
  }
  .tagline {
    text-align: center; font-size: 16px; color: #8A6B45;
    margin-top: 8px; padding: 0 42px; line-height: 1.6;
  }

  /* ====== כפתורים – רשת קומפקטית ====== */
  .links {
    display: flex; flex-wrap: wrap;
    justify-content: center; gap: 9px;
    padding: 24px 14px 4px;
  }
  .btn {
    width: 47px; height: 47px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--brown-dark); color: var(--card);
    text-decoration: none;
    transition: background .15s ease, transform .15s ease;
  }
  .btn:hover { background: var(--brown-mid); transform: translateY(-2px); }
  .btn svg { width: 23px; height: 23px; fill: var(--card); flex-shrink: 0; }
  .btn svg.stroke { fill: none; stroke: var(--card); stroke-width: 1.8; }

  /* ====== אייקוני יצירת קשר ====== */
  .contact {
    display: flex; justify-content: center; gap: 22px;
    padding: 24px 0 8px;
  }
  .icon {
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--brown-dark);
    display: grid; place-items: center;
    transition: background .15s ease;
  }
  .icon:hover { background: var(--brown-mid); }
  .icon svg { width: 29px; height: 29px; fill: var(--card); }

  /* ====== קישוט עיפרון ====== */
  .doodle { margin: 2px auto 0; display: block; width: 165px; opacity: .85; }
  .doodle path.squiggle { fill: none; stroke: var(--gold); stroke-width: 3.4; stroke-linecap: round; }
  .doodle .lead { fill: var(--brown-light); }
  .doodle .body { fill: var(--gold); }

  footer {
    margin-top: auto; text-align: center;
    font-size: 13px; color: #A08A6B; padding: 20px 0 18px;
  }

  @media (max-width: 400px) {
    .name { font-size: 44px; }
    .subtitle { font-size: 19px; }
    .btn { width: 44px; height: 44px; }
    .btn svg { width: 21px; height: 21px; }
    .links { padding: 20px 10px 4px; gap: 8px; }
    .icon { width: 56px; height: 56px; }
  }
</style>
</head>
